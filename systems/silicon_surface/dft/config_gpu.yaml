# VASP/SCAN settings (paper App. E.3) for gpu_dft_array.slurm (single rank).
# Physics identical to config_cpu.yaml; only ncore/kpar differ.

dft:
  xc: SCAN                 # meta-GGA; calculators.py sets metagga=SCAN, lasph=True
  encut: 900                # eV
  ediff: 1.0e-6              # eV (electronic)
  ediffg: -0.01              # eV/Å (unused in mode=static; kept for relax_ions mode)
  prec: Accurate
  ismear: 0                 # Gaussian smearing
  sigma: 0.1                 # eV
  lreal: false                # reciprocal-space projection
  addgrid: true
  lasph: true
  ldiag: false
  lmixtau: true
  algo: Fast
  nelm: 300
  ncore: 1                   # 1 total rank, no band-group parallelism to spread
  kpar: 1                    # 1 total rank, KPAR>1 would be invalid
  isym: 1
  gamma_centred: true
  kspacing: 0.23             # Å⁻¹
  slab_axis: 2                # z — vacuum direction; gets 1 k-point
